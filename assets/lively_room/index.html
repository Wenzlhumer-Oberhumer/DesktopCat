<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Cat Cozy Room</title>
  <link rel="stylesheet" href="style.css">
</head>
<body id="roomBody">
  <!-- Himmel & Fenster Hintergrund -->
  <div class="sky-container" id="sky">
    <div class="sun" id="sun"></div>
    <div class="moon" id="moon">
      <div class="moon-crater c1"></div>
      <div class="moon-crater c2"></div>
    </div>
    <div class="stars" id="stars"></div>
    <div class="clouds" id="clouds">
      <div class="cloud cl1"></div>
      <div class="cloud cl2"></div>
      <div class="cloud cl3"></div>
    </div>
  </div>

  <!-- Raum-Architektur -->
  <div class="room">
    <!-- Fenster-Rahmen -->
    <div class="window-frame">
      <div class="window-pane top-left"></div>
      <div class="window-pane top-right"></div>
      <div class="window-pane bot-left"></div>
      <div class="window-pane bot-right"></div>
      <div class="curtain curtain-l"></div>
      <div class="curtain curtain-r"></div>
    </div>

    <!-- Lichterkette an der Wand -->
    <div class="fairy-lights">
      <div class="bulb b1"></div>
      <div class="bulb b2"></div>
      <div class="bulb b3"></div>
      <div class="bulb b4"></div>
      <div class="bulb b5"></div>
      <div class="bulb b6"></div>
      <div class="bulb b7"></div>
    </div>

    <!-- Wand-Deko & Regal -->
    <div class="shelf">
      <div class="plant">
        <div class="pot"></div>
        <div class="leaf l1"></div>
        <div class="leaf l2"></div>
        <div class="leaf l3"></div>
      </div>
      <div class="books">
        <div class="book bk1"></div>
        <div class="book bk2"></div>
        <div class="book bk3"></div>
      </div>
      <div class="cat-clock">
        <div class="clock-face" id="clockText">12:00</div>
      </div>
    </div>

    <!-- Kamin / Lampe Glühen -->
    <div class="fireplace-glow"></div>

    <!-- Holzboden -->
    <div class="floor">
      <!-- Gemütlicher Teppich -->
      <div class="rug">
        <div class="rug-paw">🐾</div>
      </div>
    </div>

    <!-- Schwebende Partikel / Staubmotes -->
    <div class="particles" id="particles"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
